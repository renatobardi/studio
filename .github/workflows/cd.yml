# CD — deploy studio-test on every push to main, then verify with a real
# Playwright smoke test against what was just deployed.
#
# No studio-prd yet — when it exists, add a `deploy-prd` job gated by
# workflow_dispatch + digest promotion, same shape as kubo/cd.yml.
#
# studio-test lives in an LXC container ("studio-test") on oute-server,
# provisioned by lab's install-app skill (git checkout in /opt/app, plain
# `docker compose up -d --build`, no image registry). Deploying is SSH +
# `lxc exec`; verifying is a direct HTTP hit over Tailscale, same as any
# other client of the app.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-dev:
    if: github.repository == 'renatobardi/studio'
    runs-on: ubuntu-latest
    environment: studio-test
    concurrency:
      group: cd-studio-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Connect to Tailscale (studio-cd identity)
        # A static, reusable, ephemeral auth key — not an OAuth-client-
        # minted one. Every OAuth-client attempt (tag:ci, tag:cd-dev,
        # tag:studio-cd, all with correct ACL/tag config) ended up stuck
        # at BackendState=NeedsLogin well past `tailscale up` reporting
        # success. kubo's own cd.yml already uses a static authkey
        # (secrets.TS_AUTHKEY_DEV, tagged tag:cd-dev) successfully in this
        # same tailnet — matching that proven pattern instead of the
        # OAuth-client one. The tag is baked into the key at generation
        # time, so no `tags:` input here.
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY_DEV }}

      - name: Wait for the Tailscale backend to settle
        # `tailscale up` reporting success didn't mean the local daemon's
        # own state was actually "Running" yet — every deploy-dev run so
        # far hit `tailscale status` immediately after connect and got
        # "Logged out", timing out on the SSH step that followed. web-e2e
        # never hit this because bun install + Playwright's ~94MB browser
        # download bought it a couple of minutes of unintentional slack
        # before it touched the network. Poll instead of guessing a delay.
        run: |
          for attempt in $(seq 1 30); do
            state=$(tailscale status --json | python3 -c "import json,sys; print(json.load(sys.stdin)['BackendState'])")
            echo "attempt $attempt: BackendState=$state"
            [[ "$state" == "Running" ]] && exit 0
            sleep 2
          done
          echo "::error::Tailscale backend never reached Running" && exit 1

      - name: Load deploy SSH key
        env:
          SSH_KEY: ${{ secrets.STUDIO_CD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to studio-test
        env:
          HOST: ${{ secrets.STUDIO_TEST_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$HOST" \
            "lxc exec studio-test -- bash -lc 'cd /opt/app && git fetch origin main && git reset --hard origin/main && docker compose up -d --build && docker compose restart caddy'"
          # docker compose doesn't recreate a service whose only changed
          # input is a bind-mounted file (Caddyfile) — restart it
          # unconditionally so config changes always take effect.

      - name: Wait for health
        env:
          STUDIO_WEB_URL: ${{ secrets.STUDIO_TEST_WEB_URL }}
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 2 "$STUDIO_WEB_URL/api/ready" && exit 0
            sleep 2
          done
          echo "::error::studio-test never became ready after deploy" && exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright@1.63.0 install --with-deps chromium

      - name: Playwright smoke (flows 1, 2, 3 & 5) against the just-deployed studio-test
        working-directory: web
        env:
          STUDIO_WEB_URL: ${{ secrets.STUDIO_TEST_WEB_URL }}
          STUDIO_TEST_EMAIL: ${{ secrets.STUDIO_TEST_EMAIL }}
          STUDIO_TEST_PASSWORD: ${{ secrets.STUDIO_TEST_PASSWORD }}
          STUDIO_TEST_INVITE_CODE: ${{ secrets.STUDIO_TEST_INVITE_CODE }}
          STUDIO_TEST_BACKUP_PASSPHRASE: ${{ secrets.STUDIO_TEST_BACKUP_PASSPHRASE }}
          # Flows 2 & 3 (ticket #5): grant the run's fresh Identity Channel
          # membership before it publishes anything — see e2e/helpers.ts.
          STUDIO_TEST_WORKSPACE_SLUG: ${{ secrets.STUDIO_TEST_WORKSPACE_SLUG }}
          STUDIO_TEST_OWNER_PRIVATE_KEY_HEX: ${{ secrets.STUDIO_TEST_OWNER_PRIVATE_KEY_HEX }}
          # Flow 4 (ticket #7): a second, independently-seeded Account — see
          # e2e/helpers.ts's testAccountTwo and scripts/ops/seed-e2e-test-account-2.mjs.
          STUDIO_TEST_EMAIL_2: ${{ secrets.STUDIO_TEST_EMAIL_2 }}
          STUDIO_TEST_PASSWORD_2: ${{ secrets.STUDIO_TEST_PASSWORD_2 }}
          STUDIO_TEST_INVITE_CODE_2: ${{ secrets.STUDIO_TEST_INVITE_CODE_2 }}
          STUDIO_TEST_BACKUP_PASSPHRASE_2: ${{ secrets.STUDIO_TEST_BACKUP_PASSPHRASE_2 }}
        run: bun run test:e2e

      - name: Upload failure screenshots
        # PNGs only — a screenshot is a pixel render (password fields show masked dots), never
        # the typed characters a trace.zip would record. See git history for why trace.zip
        # itself must never be uploaded from this public repo's CI.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-screenshots
          path: web/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
