# CD — deploy studio-test with the exact commit CI validated, then verify with
# a real Playwright smoke test against what was just deployed.
#
# Triggered by CI's completion, not by the push itself: a push-triggered deploy
# races CI and can ship a commit whose tests are still running (or already red).
# The commit deployed is `workflow_run.head_sha` — the SHA CI actually tested —
# and never `origin/main`, which moves under a deploy when two commits land
# close together. See docs/delivery-gates.md.
#
# No studio-prd yet — when it exists, add a `deploy-prd` job gated by
# workflow_dispatch + digest promotion, same shape as kubo/cd.yml.
#
# studio-test lives in an LXC container ("studio-test") on oute-server,
# provisioned by lab's install-app skill (git checkout in /opt/app, plain
# `docker compose up -d --build`, no image registry). Deploying is SSH +
# `lxc exec`; verifying is a direct HTTP hit over Tailscale, same as any
# other client of the app.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    # The promotion gate. A CI run that did not conclude `success` never
    # reaches the deploy job, and `workflow_dispatch` — which carries no CI run
    # of its own — has to produce one below rather than walk around the gate.
    if: >-
      github.repository == 'renatobardi/studio' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      stale: ${{ steps.pick.outputs.stale }}
    steps:
      - name: Resolve the SHA, and refuse an unvalidated or superseded one
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

          # Asked of every path, dispatch included: one rule, and no branch of
          # the gate that trusts its trigger instead of the evidence.
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE&event=push&status=completed" \
            --jq '[.workflow_runs[].conclusion] | first // "missing"')
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::CI has not passed on $CANDIDATE (conclusion: $conclusion)"
            exit 1
          fi

          # Two commits landing close together produce two CI runs, and nothing
          # guarantees they finish in commit order. Deploying an older validated
          # SHA after a newer one would silently roll studio-test back, so a
          # superseded run stands down and the newer one deploys.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$CANDIDATE" == "$tip" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "deploying $CANDIDATE (main's tip)"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$CANDIDATE is superseded by $tip — standing down"
            echo "Skipped \`$CANDIDATE\`: superseded by \`$tip\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-dev:
    needs: gate
    # Positive match: a skipped or errored gate yields an empty output, which
    # must never read as "fresh".
    if: needs.gate.outputs.stale == 'false'
    runs-on: ubuntu-latest
    environment: studio-test
    concurrency:
      group: cd-studio-test
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The Playwright specs run below must be the ones from the commit
          # being deployed, not whatever main's tip carries now.
          ref: ${{ needs.gate.outputs.sha }}

      - name: Connect to Tailscale (studio-cd identity)
        # A static, reusable, ephemeral auth key — not an OAuth-client-
        # minted one. Every OAuth-client attempt (tag:ci, tag:cd-dev,
        # tag:studio-cd, all with correct ACL/tag config) ended up stuck
        # at BackendState=NeedsLogin well past `tailscale up` reporting
        # success. kubo's own cd.yml already uses a static authkey
        # (secrets.TS_AUTHKEY_DEV, tagged tag:cd-dev) successfully in this
        # same tailnet — matching that proven pattern instead of the
        # OAuth-client one. The tag is baked into the key at generation
        # time, so no `tags:` input here.
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY_DEV }}

      - name: Wait for the Tailscale backend to settle
        # `tailscale up` reporting success didn't mean the local daemon's
        # own state was actually "Running" yet — every deploy-dev run so
        # far hit `tailscale status` immediately after connect and got
        # "Logged out", timing out on the SSH step that followed. web-e2e
        # never hit this because bun install + Playwright's ~94MB browser
        # download bought it a couple of minutes of unintentional slack
        # before it touched the network. Poll instead of guessing a delay.
        run: |
          for attempt in $(seq 1 30); do
            state=$(tailscale status --json | python3 -c "import json,sys; print(json.load(sys.stdin)['BackendState'])")
            echo "attempt $attempt: BackendState=$state"
            [[ "$state" == "Running" ]] && exit 0
            sleep 2
          done
          echo "::error::Tailscale backend never reached Running" && exit 1

      - name: Load deploy SSH key
        env:
          SSH_KEY: ${{ secrets.STUDIO_CD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy the validated commit to studio-test and verify it
        env:
          HOST: ${{ secrets.STUDIO_TEST_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          on_host() {
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$HOST" \
              "lxc exec studio-test -- bash -lc '$1'"
          }

          # main can move while this job waits on its concurrency group, so the
          # gate job's check is not the last word: deploying a superseded SHA
          # here would roll studio-test back onto an older commit.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$tip" != "$DEPLOY_SHA" ]]; then
            echo "::error::$DEPLOY_SHA was superseded by $tip while this deploy queued"
            exit 1
          fi

          # Detached checkout of the exact SHA: a branch checkout would follow
          # origin/main wherever it has moved to since CI validated this one.
          # --force discards whatever the previous deploy's build left behind,
          # which is what the old hard reset was doing. The caddy restart is
          # unconditional because compose doesn't recreate a service whose only
          # changed input is a bind-mounted file (the Caddyfile).
          on_host "set -eu; cd /opt/app; git fetch --quiet origin main; git checkout --force --detach $DEPLOY_SHA; docker compose up -d --build; docker compose restart caddy"

          running=$(on_host 'cd /opt/app && git rev-parse HEAD' | tr -d '\r')
          if [[ "$running" != "$DEPLOY_SHA" ]]; then
            echo "::error::studio-test is running $running, expected $DEPLOY_SHA"
            exit 1
          fi
          echo "Deployed \`$DEPLOY_SHA\` to studio-test." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for health
        env:
          STUDIO_WEB_URL: ${{ secrets.STUDIO_TEST_WEB_URL }}
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 2 "$STUDIO_WEB_URL/api/ready" && exit 0
            sleep 2
          done
          echo "::error::studio-test never became ready after deploy" && exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright@1.63.0 install --with-deps chromium

      - name: Playwright smoke (flows 2, 3, 5, 6 & 7; flow 1 self-skips) against the just-deployed studio-test
        working-directory: web
        env:
          STUDIO_WEB_URL: ${{ secrets.STUDIO_TEST_WEB_URL }}
          STUDIO_TEST_EMAIL: ${{ secrets.STUDIO_TEST_EMAIL }}
          STUDIO_TEST_PASSWORD: ${{ secrets.STUDIO_TEST_PASSWORD }}
          STUDIO_TEST_INVITE_CODE: ${{ secrets.STUDIO_TEST_INVITE_CODE }}
          STUDIO_TEST_BACKUP_PASSPHRASE: ${{ secrets.STUDIO_TEST_BACKUP_PASSPHRASE }}
          # Flows 2 & 3 (ticket #5): grant the run's fresh Identity Channel
          # membership before it publishes anything — see e2e/helpers.ts.
          STUDIO_TEST_WORKSPACE_SLUG: ${{ secrets.STUDIO_TEST_WORKSPACE_SLUG }}
          STUDIO_TEST_OWNER_PRIVATE_KEY_HEX: ${{ secrets.STUDIO_TEST_OWNER_PRIVATE_KEY_HEX }}
          # Flow 4 (ticket #7): a second, independently-seeded Account — see
          # e2e/helpers.ts's testAccountTwo and scripts/ops/seed-e2e-test-account-2.mjs.
          STUDIO_TEST_EMAIL_2: ${{ secrets.STUDIO_TEST_EMAIL_2 }}
          STUDIO_TEST_PASSWORD_2: ${{ secrets.STUDIO_TEST_PASSWORD_2 }}
          STUDIO_TEST_BACKUP_PASSPHRASE_2: ${{ secrets.STUDIO_TEST_BACKUP_PASSPHRASE_2 }}
        run: bun run test:e2e

      - name: Upload failure screenshots
        # PNGs only — a screenshot is a pixel render (password fields show masked dots), never
        # the typed characters a trace.zip would record. See git history for why trace.zip
        # itself must never be uploaded from this public repo's CI.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-screenshots
          path: web/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
