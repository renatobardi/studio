name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write test environment
        run: |
          cat > .env <<'EOF'
          SURREAL_USER=root
          SURREAL_PASS=ci-pass
          SURREAL_NAMESPACE=studio
          SURREAL_DATABASE=studio
          MINIO_ROOT_USER=studio
          MINIO_ROOT_PASSWORD=ci-password
          WORKSPACE_SLUG=family
          WORKSPACE_KEY_SECRET=ci-workspace-key-secret
          EOF
          # The interop smoke script signs with BIP-340's public test
          # vector 0 — equally public, not a secret — and creates the
          # Workspace itself via the REST API, becoming its owner and thus
          # a Workspace Member; no seeded allowlist is needed anymore.

      - name: Build
        run: docker compose --profile test build test

      - name: Type-check
        run: docker compose --profile test run --rm test uv run mypy src tests

      - name: Lint
        run: docker compose --profile test run --rm test uv run ruff check src tests

      - name: Run test suite against the Compose stack
        run: docker compose --profile test run --rm test

      - name: Start the full stack for the interop smoke
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost/api/ready && exit 0
            sleep 2
          done
          echo "::error::api never became ready" && exit 1

      - uses: oven-sh/setup-bun@v2

      - name: Interop smoke (nostr-tools authenticates, publishes, reads back)
        working-directory: scripts/interop
        run: |
          bun install
          RELAY_URL=ws://localhost/relay/family bun run smoke.mjs

      - name: Tear down
        if: always()
        run: docker compose down -v
