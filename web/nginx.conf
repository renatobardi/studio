# The image's own default.conf (nginx-unprivileged listens on 8080, see the
# Caddyfile), plus the cache policy a service-worker app needs (issue #203):
# the shell — index.html, sw.js, the web manifest — is always revalidated, so
# a deploy reaches an open page the next time it checks; Vite's hashed assets
# never change under the same name and are kept for a year.
server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;

    location / {
        index  index.html index.htm;
    }

    # `/` is served through an internal redirect to /index.html, which lands here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
