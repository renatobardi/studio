[project]
name = "studio-api"
version = "0.1.0"
description = "Studio's FastAPI service: embedded Nostr relay, control plane and media API"
readme = "README.md"
authors = [
    { name = "Renato Bardi", email = "renato.bardi@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "surrealdb>=1.0.4",
    "pydantic>=2.9",
    "coincurve>=21.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.7",
    "boto3>=1.35",
    "boto3-stubs[s3]>=1.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
