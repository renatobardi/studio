# SonarCloud automatic analysis reads its exclusions from THIS file.
# `sonar-project.properties` is the CI-scanner's file — automatic analysis
# ignores it outright, so an exclusion written there silently does nothing.
#
# docs/UI/design/ holds a vendored, generated design artefact — not code this
# repo authors, builds or ships. Analysing it produced most of the project's
# CRITICAL "vulnerabilities" (postMessage origins, dynamic code execution)
# against a file nothing imports, drowning the findings that are ours.
sonar.exclusions=docs/UI/design/**
