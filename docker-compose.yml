services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command:
      - start
      - --user
      - ${SURREAL_USER}
      - --pass
      - ${SURREAL_PASS}
      - surrealkv:/data/studio.db
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped

  minio:
    # MinIO stopped updating Docker Hub images (Oct 2025); minio/minio now denies pulls outright.
    # quay.io is their maintained registry going forward.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build: ./api
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE}
      SURREAL_DATABASE: ${SURREAL_DATABASE}
      # Encrypts each Workspace Key at rest (ADR-0002) — never the key itself.
      WORKSPACE_KEY_SECRET: ${WORKSPACE_KEY_SECRET}
      # Set only when .env names a credential file (FIREBASE_CREDENTIALS_FILE,
      # mounted below). Unset, Firebase auth stays unconfigured — NIP-98
      # callers are unaffected.
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_FILE:+/run/secrets/firebase-adminsdk.json}
      # Optional: only read by `python -m studio_api.ensure_e2e_accounts`, which
      # CD runs before the Playwright smoke (issue #50) — unset on studio-prd.
      STUDIO_TEST_EMAIL: ${STUDIO_TEST_EMAIL:-}
      STUDIO_TEST_PASSWORD: ${STUDIO_TEST_PASSWORD:-}
      STUDIO_TEST_EMAIL_2: ${STUDIO_TEST_EMAIL_2:-}
      STUDIO_TEST_PASSWORD_2: ${STUDIO_TEST_PASSWORD_2:-}
      STUDIO_TEST_EXTENSION_EMAIL: ${STUDIO_TEST_EXTENSION_EMAIL:-}
      STUDIO_TEST_EXTENSION_PASSWORD: ${STUDIO_TEST_EXTENSION_PASSWORD:-}
      STUDIO_TEST_FIXTURES_EMAIL: ${STUDIO_TEST_FIXTURES_EMAIL:-}
      STUDIO_TEST_FIXTURES_PASSWORD: ${STUDIO_TEST_FIXTURES_PASSWORD:-}
      STUDIO_TEST_ONBOARDING_EMAIL: ${STUDIO_TEST_ONBOARDING_EMAIL:-}
      STUDIO_TEST_ONBOARDING_PASSWORD: ${STUDIO_TEST_ONBOARDING_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-studio-media}
      # uvicorn honours X-Forwarded-Proto only from these addresses (default:
      # 127.0.0.1). The api publishes no port: only this Compose network's own
      # services reach it, and of those only Caddy sends it requests, so the
      # scheme Caddy forwards is taken as-is.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # The Firebase service-account JSON, by host path — never its content.
      # /dev/null stands in when unset, so Compose never creates a directory
      # in the credential's place.
      - ${FIREBASE_CREDENTIALS_FILE:-/dev/null}:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      - surrealdb
      - minio
    restart: unless-stopped

  web:
    # Picks up web/.env at build time (Vite loads it automatically) for the
    # VITE_FIREBASE_* client config — see scripts/ops/create-firebase-project.sh.
    build: ./web
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Caddy listens on :80 inside the container; what it publishes on the host
      # is the port lab's inventory allocated to that container (studio-prd 3760,
      # studio-test 3740 — issue #263), so it comes from this host's .env. No
      # default: publishing some other port would answer nothing the host's vhost
      # asks for. The cost of `:?` is that every Compose command on a host
      # missing the variable fails, recovery ones included — which is why it is
      # written into both .env files before this change is deployed.
      - "${CADDY_HOST_PORT:?set it in .env — the host port this container publishes, see .env.example}:80"
    depends_on:
      - api
      - web
    restart: unless-stopped

  # `docker compose --profile test run --rm test` runs the suite against the
  # same surrealdb/minio services used by `api` — never against a developer
  # laptop's own Python or a fake in-memory substitute.
  test:
    profiles: ["test"]
    build: ./api
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - surrealdb
      - minio
    command: ["uv", "run", "pytest", "-q"]

volumes:
  surrealdb_data:
  minio_data:
